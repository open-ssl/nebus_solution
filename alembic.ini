# Alembic configuration. The database URL is injected at runtime from
# shared.config.settings inside db_migrations/env.py, so it is intentionally
# left as a placeholder here.

[alembic]
# path to migration scripts
script_location = db_migrations

# prepend the project root to sys.path so `shared` is importable in env.py
prepend_sys_path = .

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
timezone = UTC

# Injected at runtime in env.py — do not rely on this value.
sqlalchemy.url = INJECTED_IN_ENV_PY

[post_write_hooks]
# Format new revisions with ruff on generation.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
