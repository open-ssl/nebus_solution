server {
    listen 80;
    server_name _;

    # Serve the static UI.
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the page is same-origin (no CORS needed).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
