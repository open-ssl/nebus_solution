[project]
name = "nb-api"
version = "0.1.0"
description = "Nebus payments HTTP API (create / fetch payments, writes to the outbox)."
requires-python = ">=3.12"
dependencies = [
    "nb-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faststream[rabbit]>=0.5",
    "pydantic>=2.9",
]

[tool.uv.sources]
nb-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
