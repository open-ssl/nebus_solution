[project]
name = "nb-consumer"
version = "0.1.0"
description = "Nebus payment processor: consumes payments.new, updates status, delivers webhooks with retry/DLQ."
requires-python = ">=3.12"
dependencies = [
    "nb-shared",
    "faststream[rabbit]>=0.5",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[tool.uv.sources]
nb-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer"]
