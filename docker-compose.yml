name: nebus

networks:
  nebus-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:
  postgres:
    container_name: nebus-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nebus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nebus}
      POSTGRES_DB: ${POSTGRES_DB:-nebus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nebus} -d $${POSTGRES_DB:-nebus}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nebus-network
    restart: unless-stopped

  rabbitmq:
    container_name: nebus-rabbitmq
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nebus-network
    restart: unless-stopped

  api:
    container_name: nebus-api
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nebus-network
    restart: unless-stopped

  consumer:
    container_name: nebus-consumer
    build:
      context: .
      dockerfile: services/consumer/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - nebus-network
    restart: unless-stopped

  outbox_publisher:
    container_name: nebus-outbox-publisher
    build:
      context: .
      dockerfile: services/outbox_publisher/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - nebus-network
    restart: unless-stopped

  frontend:
    container_name: nebus-frontend
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - nebus-network
    restart: unless-stopped
